.alert{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font:700 15px/1 var(--f-body);margin-right:8px;vertical-align:2px;flex:none}
.alert.sm{width:18px;height:18px;font-size:12px;margin:0 0 0 6px;vertical-align:1px}
.ev.needs{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:5px;background:var(--bg);cursor:pointer}
.mrow b{font:700 17px var(--f-display)}
.md{background:var(--kb);color:var(--kf);font:500 12px var(--f-mono);padding:5px 6px;border-radius:3px;text-align:center;min-width:72px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>div{height:100%;background:var(--good)}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.trow:last-child{border-bottom:0}
.trow.done b{text-decoration:none}
.trow.done .tmain{opacity:1}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);color:var(--accent-ink);cursor:pointer;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.chk.on{background:var(--good);border-color:var(--good);width:34px;height:34px;font-size:20px;box-shadow:0 0 0 3px var(--good-soft)}
.tmain b{font:600 16px/1.3 var(--f-body)}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.tmeta .over{color:var(--bad);font-weight:600}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tgroup>h3{margin:0;display:flex;gap:8px;align-items:center}
.orgahint{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.orgahint .muted{margin-left:auto}
.chip.evm{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chip.done{text-decoration:line-through;opacity:.5}
.kc{background:var(--kb);color:var(--kf)}

.item.rental{background:var(--good-soft);border-left:4px solid var(--good)}
.item.rental .qty{background:var(--surface);color:var(--good);border-color:var(--good)}
.grow.rental{background:var(--good-soft)}
.grow.rental.on{background:var(--good-soft);box-shadow:inset 4px 0 0 var(--good)}
.need{font-size:13.5px;padding:5px 9px;border-radius:5px;background:var(--bg);align-self:flex-start}
.need b{font-family:var(--f-mono);font-weight:500}
.need.warn{background:var(--warn-soft);color:var(--warn)}
.need.good{background:var(--good-soft);color:var(--good)}
.need.acc{background:var(--accent-soft);color:var(--ink)}
.ev.prep{border-style:dashed}
.ev.prep .dblock{opacity:.8}
.chip.evt{font-weight:700;border-left:4px solid var(--kf);padding-left:3px}
.logo{display:block;height:36px;width:auto;border-radius:5px;background:#000}

.trow.ek{border-left:5px solid var(--kf)}
.mrow.prepr{background:transparent;border:1.5px dashed var(--kf)}
.mrow.prepr .md{background:transparent;border:1px dashed var(--kf)}
.dprow.prepr{border:1.5px dashed var(--kf);background:transparent}
.chip.prep{background:transparent;color:var(--kf);border:1.5px dashed var(--kf);padding:1.5px 3.5px}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div class="wrap" hidden>
  <header class="top"><div class="topin" id="hdr"></div></header>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=(s,o)=>parse(s).toLocaleDateString('de-DE',o);
const fmtDay=s=>fmt(s,{weekday:'short',day:'numeric',month:'short'});
const fmtLong=s=>fmt(s,{weekday:'long',day:'numeric',month:'long'});
const cmp=(a,b)=>a<b?-1:a>b?1:0;


const CFG=window.HAG_CONFIG||{};
const LOGO='<img class="logo" src="logo.png" alt="HAG Technik" width="110" height="36">';
const CONFIGURED=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/DEIN-/.test(CFG.supabaseUrl+CFG.supabaseAnonKey));
const now=new Date();
const S={
  tab:'home',sb:null,session:null,inv:[],events:[],signups:[],profiles:[],profMap:{},
  me:{id:null,name:'',isAdmin:false},loadedOnce:false,dbError:'',
  month:{y:now.getFullYear(),m:now.getMonth()},calItem:'',selDay:null,
  detail:null,editor:null,abs:null,confirm:'',
  invNew:{name:'',qty:'1',note:'',rental:false,vendor:''},invEdit:null,invDraft:null,adminCode:'',adminNew:'',adminMsg:'',
  tasks:[],tasksMissing:false,tView:'list',tFilter:'all',tShowDone:false,tSub:'now',tTopic:'',tYear:'',tMonth:{y:now.getFullYear(),m:now.getMonth()},tSel:null,taskEd:null,
  groups:[],members:[],notes:[],groupsMissing:false,notesMissing:false,hFilter:'all',nTime:'7',nAuthor:'',nTopic:'',nQuery:'',nDraft:'',gNew:'',undo:null,
  authMode:'login',authErr:'',authInfo:'',authBusy:false,auth:{email:'',password:'',username:'',invite:''},inviteNew:''
};
const $hdr=$('#hdr'),$main=$('#main'),$modal=$('#modal'),$toast=$('#toast'),$auth=$('#auth'),$wrap=$('.wrap');

/* ---------- Hilfsfunktionen ---------- */
let toastT;
function toast(msg){$toast.classList.remove('act');S.undo=null;$toast.textContent=msg;$toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$toast.classList.remove('on'),2800)}
function toastUndo(msg,fn){$toast.innerHTML=esc(msg)+'<button class="tundo" data-act="toast-undo">Rückgängig</button>';$toast.classList.add('on','act');S.undo=fn;clearTimeout(toastT);toastT=setTimeout(()=>{$toast.classList.remove('on','act');S.undo=null},6000)}
async function db(p){const r=await p;if(r.error)throw r.error;return r.data}
async function run(fn){try{return await fn()}catch(e){handleErr(e);try{await loadAll()}catch(_){}}}
function errText(e){
  const m=(e&&e.message)||'';
  if(/Technik belegt/.test(m))return m;
  if(/duplicate key|groups_name_lower/i.test(m))return 'Diesen Namen gibt es schon.';
  if(/Keine Berechtigung|row-level security|permission denied/i.test(m))return 'Dafür fehlt dir die Berechtigung.';
  if(/Mindestens ein Admin|mindestens 8 Zeichen/.test(m))return m;
  if(/Failed to fetch|NetworkError|network/i.test(m))return 'Keine Verbindung. Bitte später noch einmal versuchen.';
  return 'Das hat nicht geklappt. Bitte noch einmal versuchen.';
}
function handleErr(e){console.error(e);toast(errText(e))}
const canAct=()=>!!(S.sb&&S.me.id);
const isAdmin=()=>!!S.me.isAdmin;
const nameOf=uid=>(S.profMap[uid]&&S.profMap[uid].username)||'Teammitglied';
const invById=id=>S.inv.find(i=>i.id===id);
const evById=id=>S.events.find(e=>e.id===id);
const evStart=e=>e.days.length?e.days[0].date:'9999-12-31';
const evEnd=e=>e.days.length?e.days[e.days.length-1].date:'0000-01-01';
const byStart=(a,b)=>cmp(evStart(a),evStart(b))||cmp(a.title,b.title);
const hm=t=>t?String(t).slice(0,5):'';
function buildEvents(ev,days,gear,eg){
  return ev.map(r=>{
    const ds=days.filter(d=>d.event_id===r.id).map(d=>({date:d.date,start:hm(d.start_time),end:hm(d.end_time)})).sort((a,b)=>cmp(a.date,b.date));
    const g={};gear.filter(x=>x.event_id===r.id).forEach(x=>{g[x.item_id]=x.qty});
    return {id:r.id,title:r.title||'Ohne Titel',location:r.location||'',description:r.description||'',tech:r.tech||'',days:ds,gear:g,createdBy:r.created_by||null,createdAt:r.created_at||'',kind:r.kind||'event',parentId:r.parent_id||null,pmode:r.people_mode||'',pcount:r.people_count||0,groupIds:(eg||[]).filter(x=>x.event_id===r.id).map(x=>x.group_id),catering:r.catering||'',cateringPayer:r.catering_payer||''};
  }).filter(e=>e.days.length);
}
function timeOf(d){return d.start?(d.end?d.start+'–'+d.end:d.start+' Uhr'):'ganztägig'}
function timeLabel(e){
  const a=e.days[0],z=e.days[e.days.length-1];
  if(e.days.length===1)return fmtDay(a.date)+' · '+timeOf(a);
  return fmtDay(a.date)+' – '+fmtDay(z.date)+' · '+e.days.length+' Tage';
}
function gearOf(e){return Object.keys(e.gear||{}).map(id=>({it:invById(id),qty:+e.gear[id]||0})).filter(x=>x.it&&x.qty>0)}
const mySignup=id=>S.signups.find(s=>s.eventId===id&&s.uid===S.me.id);
const colorOf=id=>{let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return h%6};
const evColor=e=>colorOf(e.parentId||e.id);
const myGroupIds=()=>S.members.filter(m=>m.uid===S.me.id).map(m=>m.gid);
function isAddressed(e){
  if(isAdmin()||!(e.groupIds&&e.groupIds.length))return true;
  const mine=myGroupIds();return e.groupIds.some(g=>mine.includes(g));
}
const groupById=id=>S.groups.find(g=>g.id===id);
function groupNames(e){return (e.groupIds||[]).map(id=>groupById(id)).filter(Boolean).map(g=>g.name)}
function groupLine(e){const n=groupNames(e);return n.length?`<div class="meta">Für: ${esc(n.join(', '))}</div>`:''}
function normGroups(ids){
  const ok=(ids||[]).filter(id=>groupById(id));
  return (S.groups.length&&ok.length>=S.groups.length)?[]:ok;
}
function defaultGroupIds(){return normGroups(S.groups.filter(g=>g.default).map(g=>g.id))}
function userMemberNames(gid){return S.members.filter(m=>m.gid===gid).map(m=>nameOf(m.uid)).sort((a,b)=>cmp(a.toLowerCase(),b.toLowerCase()))}
const userColor=uid=>{const ids=S.profiles.map(p=>p.id).sort();const i=ids.indexOf(uid);return i<0?9:i%10};
function needsAnswer(e){return !!(S.me.id&&isAddressed(e)&&!mySignup(e.id)&&evStart(e)<=addDays(today(),14)&&evEnd(e)>=today())}
function roster(e){
  const yes=S.signups.filter(s=>s.eventId===e.id&&s.status==='yes').sort((a,b)=>cmp(a.signedAt||'',b.signedAt||'')||cmp(a.uid,b.uid));
  const no=S.signups.filter(s=>s.eventId===e.id&&s.status==='no');
  const cap=(e.pmode==='max'&&e.pcount>0)?e.pcount:Infinity;
  return {confirmed:yes.slice(0,cap),backup:yes.slice(cap),no};
}
function stats(id){
  const e=evById(id),r=e?roster(e):{confirmed:[],backup:[],no:[]};
  return {yes:r.confirmed.length,no:r.no.length,cars:r.confirmed.filter(x=>x.car).length,backup:r.backup.length};
}
function myState(e){
  const r=roster(e),uid=S.me.id,cap=(e.pmode==='max'&&e.pcount>0)?e.pcount:Infinity,full=r.confirmed.length>=cap;
  if(r.confirmed.some(x=>x.uid===uid))return {state:'yes',full};
  const bi=r.backup.findIndex(x=>x.uid===uid);
  if(bi>=0)return {state:'backup',pos:bi+1,full};
  if(r.no.some(x=>x.uid===uid))return {state:'no',full};
  return {state:'none',full};
}
function yesLabel(e){
  const m=myState(e);
  if(m.state==='backup')return 'Backup-Liste (Platz '+m.pos+')';
  if(m.state!=='yes'&&m.full)return 'Auf Backup-Liste';
  return 'Dabei';
}
function needLine(e){
  if(!e.pmode||!(e.pcount>0))return '';
  const r=roster(e),n=r.confirmed.length;
  if(e.pmode==='min'){
    const miss=e.pcount-n;
    return `<div class="need ${miss>0?'warn':'good'}"><b>${n}</b> von mindestens <b>${e.pcount}</b> Personen${miss>0?' · es fehlen noch '+miss:' · genug'}</div>`;
  }
  return `<div class="need ${r.backup.length?'acc':n>=e.pcount?'good':'warn'}"><b>${n}</b> von maximal <b>${e.pcount}</b> Personen${r.backup.length?' · '+r.backup.length+' auf der Backup-Liste':(n>=e.pcount?' · voll':'')}</div>`;
}
function prepLine(e){
  if(e.kind!=='prep')return '';
  const par=e.parentId&&evById(e.parentId);
  return `<div class="meta"><span class="pill kc k${evColor(e)}">Vorbereitung</span>${par?' für '+esc(par.title):''}</div>`;
}
function relatedHtml(e){
  if(e.kind==='prep'){
    const par=e.parentId&&evById(e.parentId);
    return `<div class="sec"><h3>Gehört zu</h3>${par?`<div class="dprow" data-act="open" data-id="${par.id}" tabindex="0"><div><b>${esc(par.title)}</b><div class="meta">Event · ${esc(timeLabel(par))}</div></div></div>`:'<div class="muted">Keinem Event zugeordnet.</div>'}</div>`;
  }
  const kids=S.events.filter(x=>x.parentId===e.id).sort(byStart);
  return `<div class="sec"><h3>Vorbereitung (${kids.length})</h3>${kids.length?kids.map(k=>`<div class="dprow" data-act="open" data-id="${k.id}" tabindex="0"><div><b>${esc(k.title)}</b><div class="meta">${esc(timeLabel(k))}</div></div><span class="pill acc">${stats(k.id).yes} dabei</span></div>`).join(''):'<div class="muted">Noch keine Vorbereitung eingetragen, zum Beispiel Technik abholen oder Aufbau.</div>'}${canAct()?`<div><button class="btn sm" data-act="new-prep" data-id="${e.id}">+ Vorbereitung</button></div>`:''}</div>`;
}

/* ---------- Belegung von Technik ---------- */
// Wie viele Stück eines Geräts belegen andere Termine an den angegebenen Tagen (höchster Tageswert)?
function usageByOthers(itemId,dates,exceptId){
  let max=0;
  for(const date of dates){
    let sum=0;
    for(const e of S.events){
      if(e.id===exceptId)continue;
      if(!e.days.some(d=>d.date===date))continue;
      sum+=+e.gear[itemId]||0;
    }
    if(sum>max)max=sum;
  }
  return max;
}
function freeFor(itemId,dates,exceptId){
  const it=invById(itemId);if(!it)return 0;
  return Math.max(0,(+it.qty||0)-usageByOthers(itemId,dates,exceptId));
}
// Termine in ±7 Tagen, die dasselbe Gerät nutzen, aber nicht am selben Tag.
function nearby(itemId,dates,exceptId){
  const out=[];
  for(const e of S.events){
    if(e.id===exceptId||!(+e.gear[itemId]>0))continue;
    const ed=e.days.map(d=>d.date);
    if(ed.some(d=>dates.includes(d)))continue;
    let best=null;
    for(const a of ed)for(const b of dates){const df=Math.abs(dayDiff(a,b));if(best===null||df<best)best=df}
    if(best!==null&&best<=7)out.push({e,diff:best});
  }
  return out.sort((a,b)=>a.diff-b.diff).slice(0,2);
}
function overbooked(it){
  const per={};
  S.events.forEach(e=>{const q=+e.gear[it.id]||0;if(!q)return;e.days.forEach(d=>{per[d.date]=(per[d.date]||0)+q})});
  return Object.keys(per).filter(d=>per[d]>(+it.qty||0)&&d>=today()).sort();
}
function usedOn(itemId,date){
  let s=0;S.events.forEach(e=>{if(e.days.some(d=>d.date===date))s+=+e.gear[itemId]||0});return s;
}

/* ---------- Ansichten ---------- */
function renderHeader(){
  const tabs=[['home','Start'],['cal','Kalender'],['tech','Technik'],['notes','Notizen'],['me','Konto']];
  if(isAdmin())tabs.splice(4,0,['orga','Orga']);
  $hdr.innerHTML=`<div class="toprow"><div class="brand">${LOGO}</div>
    <button class="btn primary sm" data-act="new" ${canAct()?'':'disabled'}>+ Termin</button></div>
    <nav class="tabs" aria-label="Bereiche">${tabs.map(t=>`<button class="tab" data-act="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${t[1]}</button>`).join('')}</nav>`;
}
function banners(){
  return S.dbError?`<div class="banner bad">${esc(S.dbError)}</div>`:'';
}
function loading(){return !S.loadedOnce&&!S.dbError}

function viewHome(){
  if(loading())return `<div class="empty"><b>Lade Termine …</b>Einen Moment.</div>`;
  const t=today(),end=addDays(t,60);
  const up=S.events.filter(e=>evEnd(e)>=t&&evStart(e)<=end&&(S.hFilter!=='mine'||isAddressed(e))).sort(byStart);
  const urgent=up.filter(needsAnswer).length;
  const next=up.find(e=>evEnd(e)>=t);
  const nextIn=next?Math.max(0,dayDiff(evStart(next),t)):null;
  let h=`<div class="sumrow">
    <div class="sum"><b>${up.length}</b><small>Termine in 60 Tagen</small></div>
    <div class="sum"><b>${nextIn===null?'–':nextIn===0?'heute':nextIn}</b><small>${nextIn===null||nextIn===0?'nächster Termin':'Tage bis zum nächsten'}</small></div>
    <div class="sum ${urgent?'urgent':''}"><b>${S.me.id?urgent:'–'}</b><small>Antwort fehlt (14 Tage)</small></div></div>`+orgaHint()+homeFilter();
  if(!up.length){
    return h+`<div class="empty"><b>Keine Termine in den nächsten 2 Monaten</b>${canAct()?'Mit „+ Termin“ oben rechts trägst du den ersten ein.':'Sobald jemand einen Termin einträgt, erscheint er hier.'}</div>`;
  }
  let lastKey='';
  h+=`<div class="list">`;
  for(const e of up){
    const s0=evStart(e)<t?t:evStart(e);
    const key=evStart(e)<=t?'Läuft gerade':fmt(s0,{month:'long',year:'numeric'});
    if(key!==lastKey){h+=`</div><div class="month">${esc(key)}</div><div class="list">`;lastKey=key}
    h+=cardHtml(e);
  }
  return h+`</div>`;
}
function cardHtml(e){
  const st=stats(e.id),me=mySignup(e.id),g=gearOf(e);
  const first=parse(evStart(e));
  const needs=needsAnswer(e);
  const ms=myState(e);
  const pill=!S.me.id?'':!isAddressed(e)?'<span class="pill">Nicht für dich</span>':ms.state==='yes'?'<span class="pill good">Du bist dabei</span>':ms.state==='backup'?`<span class="pill acc">Backup-Liste, Platz ${ms.pos}</span>`:ms.state==='no'?'<span class="pill bad">Abgesagt</span>':(needs?'<span class="pill bad">Antwort fehlt</span>':'<span class="pill warn">Antwort fehlt</span>');
  const units=g.reduce((a,x)=>a+x.qty,0);
  return `<article class="card ev k${evColor(e)} ${needs?'needs':''} ${e.kind==='prep'?'prep':''} ${S.me.id&&!isAddressed(e)?'foreign':''}" data-act="open" data-id="${e.id}" tabindex="0" aria-label="${esc(e.title)}">
    <div class="dblock"><span>${esc(fmt(evStart(e),{weekday:'short'}).replace('.',''))}</span><b>${first.getDate()}</b><span>${esc(fmt(evStart(e),{month:'short'}).replace('.',''))}</span></div>
    <div class="evbody">
      <div class="evhead"><div><h3 class="title">${needs?'<span class="alert" role="img" aria-label="Antwort fehlt, Termin in den nächsten 14 Tagen">!</span>':''}${esc(e.title)}</h3>${prepLine(e)}<div class="meta">${esc(timeLabel(e))}${e.location?' · '+esc(e.location):''}</div>${groupLine(e)}</div>${pill}</div>
      ${needLine(e)}
      <div class="counts">
        <span class="cnt"><b>${st.yes}</b><small>dabei</small></span>
        <span class="cnt"><b>${st.cars}</b><small>${st.cars===1?'Auto':'Autos'}</small></span>
        <span class="cnt"><b>${st.no}</b><small>abgesagt</small></span>
        ${e.kind==='prep'?'':`<span class="cnt"><b>${units}</b><small>Technik (${g.length} Arten)</small></span>`}
      </div>
      ${S.me.id&&isAddressed(e)?`<div class="quick">
        <button class="btn sm ${me&&me.status==='yes'?'on-yes':''}" data-act="yes" data-id="${e.id}" ${canAct()?'':'disabled'}>${yesLabel(e)}</button>
        <button class="btn sm ${me&&me.status==='no'?'on-no':''}" data-act="no" data-id="${e.id}" ${canAct()?'':'disabled'}>Nicht dabei</button>
        <label class="tog"><input type="checkbox" data-car="${e.id}" ${me&&me.status==='yes'&&me.car?'checked':''} ${me&&me.status==='yes'&&canAct()?'':'disabled'}>Mit Auto</label>
      </div>`:''}
    </div></article>`;
}

function viewCal(){
  if(loading())return `<div class="empty"><b>Lade Kalender …</b>Einen Moment.</div>`;
  const {y,m}=S.month;
  const first=new Date(y,m,1,12),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const total=Math.ceil((off+dim)/7)*7,t=today();
  const item=S.calItem?invById(S.calItem):null;
  let cells='';

function monthTitle(y,m){return new Date(y,m,1,12).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}

const CATS={absprache:'Absprache',technik:'Technik',uebergabe:'Übergabe',sonstiges:'Sonstiges'};
const CATK={absprache:0,technik:5,uebergabe:4,sonstiges:2};
function dueLabel(x){
  if(!x.due)return 'ohne Datum';
  const d=dayDiff(x.due,today()),base=fmtDay(x.due);
  if(x.done)return base;
  if(d<0)return base+' · '+(-d)+(d===-1?' Tag':' Tage')+' überfällig';
  if(d===0)return base+' · heute';
  if(d===1)return base+' · morgen';
  return base+' · in '+d+' Tagen';
}
function taskRow(x){

    </div></div>`;
}
function orgaHint(){
  if(!isAdmin()||!S.tasks.length)return '';
  const t=today(),w=addDays(t,7),open=S.tasks.filter(x=>!x.done);
  const over=open.filter(x=>x.due&&x.due<t).length,soon=open.filter(x=>x.due&&x.due>=t&&x.due<=w).length;
  if(!over&&!soon)return '';

}
const taskYear=x=>{const ev=x.eventId&&evById(x.eventId);return (x.due||(ev?evStart(ev):'')||(x.doneAt||'').slice(0,10)||'0000').slice(0,4)};
const topicKey=v=>String(v||'').trim().toLowerCase();
function topicOf(x){const ev=x.eventId&&evById(x.eventId);return ((ev&&ev.title)||x.eventTitle||'').trim()}
function allTopics(){
  const m=new Map();
  const add=t=>{const k=topicKey(t);if(k&&!m.has(k))m.set(k,String(t).trim())};
  S.events.filter(e=>e.kind!=='prep').forEach(e=>add(e.title));
  S.tasks.forEach(x=>add(topicOf(x)));
  return [...m.entries()].sort((a,b)=>cmp(a[1].toLowerCase(),b[1].toLowerCase()));
}
function topicPreps(){
  if(!S.tTopic)return [];
  return S.events.filter(e=>{const par=e.kind==='prep'&&e.parentId&&evById(e.parentId);return par&&topicKey(par.title)===S.tTopic&&(!S.tYear||evStart(e).slice(0,4)===S.tYear)}).sort(byStart);
}
function prepRow(e){

}
function viewOrga(){

  const topics=allTopics();
  if(S.tTopic&&!topics.some(x=>x[0]===S.tTopic))S.tTopic='';

  ${S.tTopic&&yearsAvail.length?`<select id="tyear" data-tyear aria-label="Jahr" style="width:auto"><option value="">Alle Jahre</option>${yearsAvail.map(y=>`<option value="${y}" ${S.tYear===y?'selected':''}>${y}</option>`).join('')}</select>`:''}
  <select id="tfilter" data-tfilter aria-label="Filter" style="width:auto"><option value="all" ${S.tFilter==='all'?'selected':''}>Alle Aufgaben</option><option value="mine" ${S.tFilter==='mine'?'selected':''}>Meine Aufgaben</option></select></div>`;
  if(S.tTopic){
    const nm=(topics.find(x=>x[0]===S.tTopic)||['',''])[1];
    h+=`<div class="muted">Alles zu „${esc(nm)}“: ${open.length} offen, ${done.length} erledigt${preps.length?', '+preps.length+' Vorbereitung'+(preps.length===1?'':'en')+' im Kalender':''}. Aufgaben aus früheren Jahren stehen unter „Bisherige“. Mit dem Jahr oben grenzt du es ein.</div>`;
  }
  if(!S.tasks.length)return h+`<div class="empty"><b>Noch keine Aufgaben</b>Trag ein, was du bis zur Übergabe noch organisieren oder klären musst.</div>`;
  if(!past){
    h+=`<div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div><small>${done.length} von ${list.length} erledigt</small>`;

    const w=addDays(t,7),m=addDays(t,30);

    const groups=[['Überfällig',os.filter(x=>x.due&&x.due<t),'bad'],['Diese Woche',os.filter(x=>x.due&&x.due>=t&&x.due<=w),'warn'],['In den nächsten 30 Tagen',os.filter(x=>x.due&&x.due>w&&x.due<=m),''],['Später',os.filter(x=>x.due&&x.due>m),''],['Ohne Datum',os.filter(x=>!x.due),'']];
    for(const g of groups){if(!g[1].length)continue;h+=`<div class="tgroup"><h3>${g[0]} <span class="pill ${g[2]}">${g[1].length}</span></h3><div class="card">${g[1].map(taskRow).join('')}</div></div>`}

  return h;
}

const STOP=new Set('und der die das ein eine einer eines einem einen ist sind war waren wird werden wurde nicht mit von für auf auch noch nur aber oder wenn dass dann denn weil wie was wer wo den dem des zum zur bei nach vor über unter aus als wir ihr sie ich er es man mal ganz sehr schon wieder immer heute gestern morgen hier dort dies diese dieser haben hat hatte kann können muss müssen soll sollte sollen gibt geht gehen mehr viel viele etwas alle alles nichts jetzt bitte doch also dabei damit dafür davon dazu sein seine seiner ihre ihren unser unsere kein keine keiner sind wäre würde wurden noch ihm ihn ihnen uns euch mir dir'.split(' '));
const stem=w=>{for(let i=0;i<2;i++)if(w.length>4)w=w.replace(/(en|er|es|e|n|s)$/,'');return w};
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const noteDay=n=>dkey(new Date(n.created_at));
const noteTime=n=>new Date(n.created_at).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
function noteTokens(body){
  const out=new Map();
  (body.toLowerCase().match(/#?[\p{L}\d]{3,}/gu)||[]).forEach(w=>{
    if(w[0]==='#')out.set(w,w);
    else if(w.length>=4&&!/^\d+$/.test(w)&&!STOP.has(w)){const k=stem(w);if(!out.has(k))out.set(k,w)}
  });
  return out;
}
function notesInWindow(){
  const t=today(),lo=S.nTime==='d'?t:S.nTime==='7'?addDays(t,-6):S.nTime==='30'?addDays(t,-29):'';
  return S.notes.filter(n=>!lo||noteDay(n)>=lo);
}
function topicList(list){
  const cnt=new Map(),lab=new Map();
  list.forEach(n=>noteTokens(n.body).forEach((w,k)=>{cnt.set(k,(cnt.get(k)||0)+1);if(!lab.has(k))lab.set(k,w)}));
  let arr=[...cnt.entries()].filter(([k,c])=>c>=2||k[0]==='#').sort((a,b)=>b[1]-a[1]||cmp(a[0],b[0])).slice(0,14).map(([k,c])=>({k,c,l:k[0]==='#'?lab.get(k):lab.get(k).charAt(0).toUpperCase()+lab.get(k).slice(1)}));
  if(S.nTopic&&!arr.some(x=>x.k===S.nTopic))arr.unshift({k:S.nTopic,c:cnt.get(S.nTopic)||0,l:S.nTopic[0]==='#'?S.nTopic:S.nTopic.charAt(0).toUpperCase()+S.nTopic.slice(1)});
  return arr;
}
function noteMatches(n){
  if(S.nAuthor&&n.author!==S.nAuthor)return false;
  if(S.nTopic&&!noteTokens(n.body).has(S.nTopic))return false;
  const q=S.nQuery.trim().toLowerCase();
  if(q&&!(n.body.toLowerCase().includes(q)||nameOf(n.author).toLowerCase().includes(q)))return false;
  return true;
}
function noteBody(b){return esc(b).replace(/(^|\s)(#[\p{L}\d_-]+)/gu,'$1<b>$2</b>')}
function notesResults(){
  const list=notesInWindow().filter(noteMatches);
  if(!list.length)return `<div class="empty"><b>Keine Notizen</b>${S.notes.length?'Mit diesen Filtern gibt es nichts. Probiere einen anderen Zeitraum.':'Schreib oben die erste Notiz.'}</div>`;
  let h='',last='';
  const t=today();
  for(const n of list){
    const k=noteDay(n);
    if(k!==last){h+=`<div class="nday">${esc(k===t?'Heute':k===addDays(t,-1)?'Gestern':fmtLong(k))}</div>`;last=k}
    const mine=n.author===S.me.id;
    h+=`<div class="note k${userColor(n.author)}"><div class="nh"><b>${esc(nameOf(n.author))}</b><span class="mono">${esc(noteTime(n))} Uhr</span></div>
      ${(mine||isAdmin())?`<button class="done" data-act="note-done" data-id="${n.id}" aria-label="Notiz löschen" title="Erledigt, Notiz löschen">✓</button>`:'<span></span>'}
      <div class="nb">${noteBody(n.body)}</div></div>`;
  }
  return h;
}

async function addNote(){
  const body=S.nDraft.trim();
  if(!body||!canAct())return;
  const tmp={id:'tmp'+Date.now(),body,author:S.me.id,created_at:new Date().toISOString()};
  S.notes.unshift(tmp);S.nDraft='';renderMain();
  const nok=await run(async()=>{await db(S.sb.from('notes').insert({body,author:S.me.id}));await loadAll();return true});
  if(nok)toast('Notiz gespeichert');
}
function deleteNote(id){
  const n=S.notes.find(x=>x.id===id);if(!n||!canAct())return;
  S.notes=S.notes.filter(x=>x.id!==id);renderMain();
  run(async()=>{await db(S.sb.from('notes').delete().eq('id',id));await loadAll()}).then(()=>{
    if(n.author===S.me.id){
      toastUndo('Notiz gelöscht',()=>{
        S.notes.unshift(n);S.notes.sort((a,b)=>cmp(b.created_at,a.created_at));renderMain();
        run(async()=>{await db(S.sb.from('notes').insert({id:n.id,body:n.body,author:n.author,created_at:n.created_at}));await loadAll()});
      });
    }else toast('Notiz gelöscht');
  });
}

}

function fixGear(){
  const ed=S.editor;if(!ed)return;
  const dates=ed.days.map(d=>d.date).filter(Boolean);
  const msgs=[];
  for(const id of Object.keys(ed.gear)){
    const it=invById(id);
    if(!it){delete ed.gear[id];continue}
    const f=freeFor(id,dates,ed.id);
    if(f<ed.gear[id]){
      if(f<=0){delete ed.gear[id];msgs.push(it.name+' ist an diesen Tagen belegt und wurde entfernt.')}
      else{ed.gear[id]=f;msgs.push(it.name+' auf '+f+' verringert, mehr ist nicht frei.')}
    }
  }
  ed.warn=msgs.join(' ');
}

/* ---------- Rendering ---------- */
function typing(root){
  const a=document.activeElement;if(!a||!root.contains(a))return false;
  return a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','radio','button','submit'].includes(a.type));
}
function renderModal(force){
  if(!force&&typing($modal))return;
  let inner='';
  if(S.editor)inner=editorHtml();
  else if(S.taskEd)inner=taskEditorHtml();
  else if(S.detail){const e=evById(S.detail);if(e)inner=detailHtml(e);else S.detail=null}
  if(!inner){$modal.innerHTML='';return}
  const keepScroll=$('.sheet',$modal)?$('.sheet',$modal).scrollTop:0;
  $modal.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
  const sh=$('.sheet',$modal);if(sh)sh.scrollTop=keepScroll;
}
function renderMain(){
  if(S.tab==='orga'&&!isAdmin())S.tab='home';

function openEditor(id,date,opts){
  const e=id?evById(id):null,o=opts||{};
  const base=e?{id:e.id,title:e.title,location:e.location,description:e.description,tech:e.tech,days:e.days.map(d=>({...d})),gear:{...e.gear},err:'',warn:''}
    :{id:null,title:'',location:'',description:'',tech:'',days:[{date:date||(S.selDay||today()),start:'',end:''}],gear:{},err:'',warn:''};
  const extra=e?{kind:e.kind,parentId:e.parentId||'',pmode:e.pmode||'',pcount:e.pcount?String(e.pcount):'',groupIds:(e.groupIds||[]).slice(),catering:e.catering||'',cateringPayer:e.cateringPayer||''}
    :{kind:o.kind||'event',parentId:o.parentId||'',pmode:'',pcount:'',groupIds:defaultGroupIds(),catering:'',cateringPayer:''};
  S.editor=Object.assign(base,extra);
  if(!e&&o.kind==='prep'&&o.parentId){const par=evById(o.parentId);if(par){S.editor.groupIds=(par.groupIds||[]).slice();S.editor.location=par.location;S.editor.days=[{date:addDays(par.days[0].date,-1),start:'',end:''}]}}
  S.confirm='';
  renderModal(true);
}
async function saveEditor(){
  const ed=S.editor;if(!ed||!canAct())return;
  ed.err='';
  if(!ed.title.trim())ed.err='Bitte einen Titel eingeben.';
  const seen=new Set();
  for(const d of ed.days){
    if(!d.date){ed.err='Bitte bei jedem Tag ein Datum angeben.';break}
    if(seen.has(d.date)){ed.err='Ein Tag kommt doppelt vor.';break}
    seen.add(d.date);
    if(d.start&&d.end&&d.end<=d.start){ed.err='Das Ende muss nach dem Beginn liegen.';break}
  }
  if(!ed.err&&ed.pmode&&!(parseInt(ed.pcount,10)>0))ed.err='Bitte die Personenzahl angeben.';
  if(!ed.err&&ed.kind==='prep')ed.gear={};
  if(!ed.err)fixGear();
  if(ed.err||ed.warn){renderModal(true);if(ed.warn&&!ed.err)toast('Die Technik wurde angepasst. Bitte prüfen und noch einmal speichern.');return}
  const gear=Object.keys(ed.gear).filter(k=>+ed.gear[k]>0).map(k=>({item_id:k,qty:+ed.gear[k]}));
  const payload={id:ed.id||null,title:ed.title.trim(),location:ed.location.trim(),description:ed.description.trim(),tech:ed.tech.trim(),kind:ed.kind||'event',parent_id:ed.kind==='prep'?(ed.parentId||null):null,people_mode:ed.pmode||null,people_count:ed.pmode?(parseInt(ed.pcount,10)||null):null,group_ids:normGroups(ed.groupIds),catering:ed.kind==='prep'?'':ed.catering.trim(),catering_payer:ed.kind==='prep'?'':ed.cateringPayer.trim(),
    days:ed.days.slice().sort((a,b)=>cmp(a.date,b.date)).map(d=>({date:d.date,start:d.start||'',end:d.end||''})),gear};
  const wasNew=!ed.id;
  let id;
  try{id=await db(S.sb.rpc('save_event',{p:payload}))}
  catch(e){ed.err=errText(e);renderModal(true);try{await loadAll()}catch(_){}return}
  S.editor=null;S.detail=id;S.abs=null;
  await run(loadAll);
  renderAll(true);
  toast(wasNew?'Termin eingetragen':'Termin gespeichert');
}
async function deleteEvent(id){
  S.detail=null;S.confirm='';renderAll(true);
  await run(async()=>{await db(S.sb.from('events').delete().eq('id',id));await loadAll()});
  toast('Termin gelöscht');
}
function setSignup(evId,patch){
  if(!canAct())return;
  const e0=evById(evId);if(e0&&!isAddressed(e0)){toast('Dieser Termin richtet sich an andere Gruppen.');return}
  const uid=S.me.id,cur=mySignup(evId);
  const next={status:cur?cur.status:'yes',car:cur?!!cur.car:false,...patch};
  const becameYes=next.status==='yes'&&(!cur||cur.status!=='yes');
  const signedAt=becameYes?new Date().toISOString():((cur&&cur.signedAt)||new Date().toISOString());
  if(next.status!=='yes')next.car=false;
  if(cur){cur.status=next.status;cur.car=next.car;if(becameYes)cur.signedAt=signedAt;if(next.status!=='yes')cur.absences=[]}
  else S.signups.push({id:evId+'__'+uid,eventId:evId,uid,status:next.status,car:next.car,signedAt,absences:[]});
  renderAll(false);
  return run(async()=>{
    await db(S.sb.from('signups').upsert(Object.assign({event_id:evId,user_id:uid,status:next.status,car:next.car},becameYes?{signed_at:signedAt}:{}),{onConflict:'event_id,user_id'}));
    if(next.status!=='yes')await db(S.sb.from('absences').delete().eq('event_id',evId).eq('user_id',uid));
    await loadAll();
  });
}
function toggleStatus(evId,st){
  if(!canAct())return;
  const e0=evById(evId);if(e0&&!isAddressed(e0)){toast('Dieser Termin richtet sich an andere Gruppen.');return}
  const me=mySignup(evId);
  if(me&&me.status===st){
    S.signups=S.signups.filter(s=>s!==me);renderAll(false);
    run(async()=>{
      await db(S.sb.from('absences').delete().eq('event_id',evId).eq('user_id',S.me.id));
      await db(S.sb.from('signups').delete().eq('event_id',evId).eq('user_id',S.me.id));
      await loadAll();
    });
    return;
  }
  setSignup(evId,{status:st});
}

}

    :{id:null,title:'',note:'',due:date||'',category:'absprache',contact:'',assignee:S.me.id||'',eventId:'',eventTitle:S.tTopic?((allTopics().find(z=>z[0]===S.tTopic)||['',''])[1]):'',repeat:false,err:''};

async function saveTask(){

  if(!t.title.trim()){t.err='Bitte einen Titel eingeben.';renderModal(true);return}
  const row={title:t.title.trim(),note:t.note.trim(),due_date:t.due||null,category:t.category,contact:t.contact.trim(),assignee:t.assignee||null,event_id:t.eventId||null,event_title:(t.eventTitle||'').trim()||((t.eventId&&evById(t.eventId))?evById(t.eventId).title:''),repeat_yearly:!!t.repeat};

function addYear(d){const x=parse(d);x.setFullYear(x.getFullYear()+1);return ymd(x)}
function toggleTask(id){

document.addEventListener('click',ev=>{
  if(ev.target.closest('label.tog'))return;
  const chip=ev.target.closest('[data-ev]');
  if(chip&&!ev.target.closest('[data-act]')){S.detail=chip.dataset.ev;S.abs=null;renderModal(true);return}
  const tk=ev.target.closest('[data-task]');
  if(tk&&!ev.target.closest('[data-act]')){openTaskEditor(tk.dataset.task);return}
  const el=ev.target.closest('[data-act]');
  if(!el){
    const td=ev.target.closest('[data-tday]');
    if(td){S.tSel=td.dataset.tday;renderMain();return}
    const day=ev.target.closest('[data-day]');
    if(day){S.selDay=day.dataset.day;renderMain()}
    return;
  }
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='scrim'){if(ev.target!==el)return;S.detail=null;S.editor=null;S.taskEd=null;S.confirm='';renderModal(true);return}
  if(el.disabled)return;
  switch(a){
    case 'tab':S.tab=el.dataset.v;renderAll(true);window.scrollTo(0,0);break;
    case 'open':S.detail=id;S.abs=null;S.confirm='';renderModal(true);break;
    case 'close':S.detail=null;S.confirm='';renderModal(true);break;
    case 'new':openEditor(null,el.dataset.date);break;
    case 'edit':S.detail=null;openEditor(id);break;
    case 'del':
      if(S.confirm==='ev'+id)deleteEvent(id);else{S.confirm='ev'+id;renderModal(true)}
      break;
    case 'yes':case 'no':ev.stopPropagation();toggleStatus(id,a);break;
    case 'calprev':S.month.m--;if(S.month.m<0){S.month.m=11;S.month.y--}renderMain();break;
    case 'calnext':S.month.m++;if(S.month.m>11){S.month.m=0;S.month.y++}renderMain();break;
    case 'caltoday':{const n=new Date();S.month={y:n.getFullYear(),m:n.getMonth()};S.selDay=today();renderMain();break}
    case 'ed-cancel':S.editor=null;renderModal(true);break;
    case 'ed-save':saveEditor();break;
    case 'ed-addday':{
      const ed=S.editor,last=ed.days[ed.days.length-1];
      ed.days.push({date:last.date?addDays(last.date,1):today(),start:last.start,end:last.end});
      fixGear();renderModal(true);break}
    case 'ed-rmday':S.editor.days.splice(+el.dataset.i,1);fixGear();renderModal(true);break;
    case 'ed-gopen':S.editor.gearOpen=!S.editor.gearOpen;renderModal(true);break;
    case 'ed-qty':{
      const ed=S.editor,dates=ed.days.map(d=>d.date).filter(Boolean);
      const f=freeFor(id,dates,ed.id);let q=(+ed.gear[id]||0)+(+el.dataset.d);
      if(q>f)q=f;
      if(q<=0)delete ed.gear[id];else ed.gear[id]=q;
      ed.warn='';renderModal(true);break}
    case 'abs-add':{
      const e=evById(S.detail),ab=S.abs;if(!e||!ab)break;
      if(!ab.from||!ab.to||ab.to<=ab.from){toast('Bitte eine Zeit von–bis eintragen, die Ende nach Beginn hat.');break}
      if(!mySignup(e.id))break;
      addAbsence(e.id,ab);
      break}
    case 'abs-rm':{
      const e=evById(S.detail),me=e&&mySignup(e.id);if(!me)break;
      const abx=(me.absences||[])[+el.dataset.i];if(abx)removeAbsence(abx.id);
      break}
    case 'inv-edit':{const it=invById(id);S.invEdit=id;S.invDraft={name:it.name,qty:String(it.qty),note:it.note||'',rental:!!it.rental,vendor:it.vendor||''};S.confirm='';renderMain();break}
    case 'inv-cancel':S.invEdit=null;S.confirm='';renderMain();break;
    case 'inv-qty':{
      const it=invById(id);if(!it||!canAct())break;
      const q=Math.max(0,(+it.qty||0)+(+el.dataset.d));
      run(()=>db(S.sb.from('inventory').update({qty:q}).eq('id',id)).then(loadAll));break}
    case 'inv-del':
      if(S.confirm==='inv'+id){
        S.confirm='';S.invEdit=null;renderMain();
        run(()=>db(S.sb.from('inventory').delete().eq('id',id)).then(loadAll)).then(()=>toast('Technik gelöscht'));
      }else{S.confirm='inv'+id;renderMain()}
      break;
    case 'admin-set':run(()=>db(S.sb.rpc('set_user_admin',{p_user:id,p_admin:el.dataset.v==='1'})).then(loadAll));break;
    case 'task-new':openTaskEditor(null,el.dataset.date);break;
    case 'task-toggle':toggleTask(id);break;
    case 'task-save':saveTask();break;
    case 'task-cancel':S.taskEd=null;S.confirm='';renderModal(true);break;
    case 'task-del':if(S.confirm==='task'+id)deleteTask(id);else{S.confirm='task'+id;renderModal(true)}break;
    case 'tview':S.tView=el.dataset.v;renderMain();break;
    case 'task-copy':{
      const x=S.tasks.find(z=>z.id===id);if(!x||!canAct())break;
      const ev=x.eventId&&evById(x.eventId);
      run(async()=>{
        await db(S.sb.from('tasks').insert({title:x.title,note:x.note,due_date:x.due||null,category:x.category,contact:x.contact,assignee:x.assignee,event_id:ev?ev.id:null,event_title:topicOf(x),repeat_yearly:x.repeat,created_by:S.me.id}));
        await loadAll();
      }).then(()=>toast('Kopiert nach „Aktuell“'+(x.due?' mit dem Datum '+fmt(x.due,{day:'numeric',month:'short',year:'numeric'}):'')+'. Zum Ändern antippen.'));
      break}
    case 'tsub':S.tSub=el.dataset.v;renderMain();break;
    case 'tprev':S.tMonth.m--;if(S.tMonth.m<0){S.tMonth.m=11;S.tMonth.y--}renderMain();break;
    case 'tnext':S.tMonth.m++;if(S.tMonth.m>11){S.tMonth.m=0;S.tMonth.y++}renderMain();break;
    case 'ttoday':{const n=new Date();S.tMonth={y:n.getFullYear(),m:n.getMonth()};S.tSel=today();renderMain();break}
    case 'ed-kind':S.editor.kind=el.dataset.v;if(S.editor.kind!=='prep')S.editor.parentId='';renderModal(true);break;
    case 'new-prep':S.detail=null;openEditor(null,null,{kind:'prep',parentId:id});break;
    case 'h-filter':S.hFilter=el.dataset.v;renderMain();break;
    case 'ed-group':{
      const ed=S.editor,gid=id;
      if(!gid)ed.groupIds=[];
      else{const i=ed.groupIds.indexOf(gid);if(i>=0)ed.groupIds.splice(i,1);else ed.groupIds.push(gid);ed.groupIds=normGroups(ed.groupIds)}
      renderModal(true);break}
    case 'gm-toggle':{
      const g=el.dataset.g,u=el.dataset.u,i=S.members.findIndex(m=>m.gid===g&&m.uid===u);
      if(i>=0){S.members.splice(i,1);renderMain();run(()=>db(S.sb.from('group_members').delete().eq('group_id',g).eq('user_id',u)).then(loadAll))}
      else{S.members.push({gid:g,uid:u});renderMain();run(()=>db(S.sb.from('group_members').insert({group_id:g,user_id:u})).then(loadAll))}
      break}
    case 'g-del':
      if(S.confirm==='g'+id){S.confirm='';S.groups=S.groups.filter(g=>g.id!==id);S.members=S.members.filter(m=>m.gid!==id);S.events.forEach(e=>{e.groupIds=(e.groupIds||[]).filter(x=>x!==id)});renderMain();run(()=>db(S.sb.from('groups').delete().eq('id',id)).then(loadAll)).then(()=>toast('Gruppe gelöscht'))}
      else{S.confirm='g'+id;renderMain()}
      break;
    case 'n-time':S.nTime=el.dataset.v;S.nTopic='';renderMain();break;
    case 'n-author':S.nAuthor=S.nAuthor===el.dataset.v?'':el.dataset.v;renderMain();break;
    case 'n-topic':S.nTopic=S.nTopic===el.dataset.v?'':el.dataset.v;renderMain();break;
    case 'note-done':deleteNote(id);break;
    case 'toast-undo':{const f=S.undo;S.undo=null;$toast.classList.remove('on','act');if(f)f();break}
    case 'logout':S.sb.auth.signOut();break;
    case 'authmode':S.authMode=el.dataset.v;S.authErr='';S.authInfo='';renderAuth();break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&(S.detail||S.editor||S.taskEd)){S.detail=null;S.editor=null;S.taskEd=null;S.confirm='';renderModal(true);return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('[data-act][tabindex],[data-day],[data-ev]')&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(ev.target.tagName)){ev.preventDefault();ev.target.click()}
});
document.addEventListener('input',ev=>{
  const t=ev.target,b=t.dataset&&t.dataset.bind;if(!b)return;
  const p=b.split(':');
  const val=t.type==='checkbox'?t.checked:t.value;
  if(p.length===2)S[p[0]][p[1]]=val;else S[p[0]]=val;
  if(b==='nQuery'){const r=document.getElementById('nresults');if(r)r.innerHTML=notesResults()}
});
document.addEventListener('change',ev=>{
  const t=ev.target,d=t.dataset||{};
  if(d.car){setSignup(d.car,{car:t.checked});return}
  if(d.gname){
    const g=groupById(d.gname),name=t.value.trim();
    if(!g||!name||name===g.name){t.value=g?g.name:'';return}
    const old=g.name;g.name=name;
    run(()=>db(S.sb.from('groups').update({name}).eq('id',g.id)).then(loadAll)).then(()=>{if(S.groups.find(x=>x.id===g.id)&&groupById(g.id).name!==name)renderMain()});
    return}
  if(d.gdef){
    const g=groupById(d.gdef);if(!g)return;
    g.default=t.checked;
    run(()=>db(S.sb.from('groups').update({default_target:t.checked}).eq('id',g.id)).then(loadAll));
    return}
  if(t.hasAttribute('data-calitem')){S.calItem=t.value;renderMain();return}
  if(t.hasAttribute('data-tfilter')){S.tFilter=t.value;renderMain();return}
  if(t.hasAttribute('data-ttopic')){S.tTopic=t.value;S.tYear='';renderMain();return}
  if(t.hasAttribute('data-tyear')){S.tYear=t.value;renderMain();return}
  if(d.dchg){
    const p=d.dchg.split(':');S.editor.days[+p[0]][p[1]]=t.value;fixGear();renderModal(true);return}
  if(d.gtog){
    const id=d.gtog,ed=S.editor,dates=ed.days.map(x=>x.date).filter(Boolean);
    if(t.checked){if(freeFor(id,dates,ed.id)>0)ed.gear[id]=1}else delete ed.gear[id];
    ed.warn='';renderModal(true);return}
  if(d.abs&&S.abs){
    S.abs[d.abs]=t.value;
    if(d.abs==='date'){const e=evById(S.detail);const day=e&&e.days.find(x=>x.date===t.value);if(day){S.abs.from=day.start||'';S.abs.to=day.end||''}renderModal(true)}
  }
});
document.addEventListener('submit',async ev=>{
  const f=ev.target.dataset&&ev.target.dataset.form;if(!f)return;
  ev.preventDefault();
  if(f==='login'||f==='register'||f==='forgot'||f==='newpass'){authSubmit(f);return}
  if(f==='invadd'){
    const n=S.invNew,name=n.name.trim(),q=Math.max(1,parseInt(n.qty,10)||1);
    if(!name){toast('Bitte eine Bezeichnung eingeben.');return}
    S.invNew={name:'',qty:'1',note:'',rental:false,vendor:''};renderMain();
    await run(async()=>{await db(S.sb.from('inventory').insert({name,qty:q,note:n.note.trim(),rental:!!n.rental,vendor:n.vendor.trim()}));await loadAll()});
    toast(name+' hinzugefügt');
  }else if(f==='invsave'){
    const id=ev.target.dataset.id,d=S.invDraft,name=d.name.trim();
    if(!name){toast('Bitte eine Bezeichnung eingeben.');return}
    const q=Math.max(0,parseInt(d.qty,10)||0);
    S.invEdit=null;renderMain();
    await run(async()=>{await db(S.sb.from('inventory').update({name,qty:q,note:d.note.trim(),rental:!!d.rental,vendor:d.vendor.trim()}).eq('id',id));await loadAll()});
    toast('Gespeichert');
  }else if(f==='noteadd'){
    addNote();
  }else if(f==='groupadd'){
    const name=S.gNew.trim();
    if(!name){toast('Bitte einen Namen eingeben.');return}
    S.gNew='';renderMain();
    const gok=await run(async()=>{await db(S.sb.from('groups').insert({name,default_target:true}));await loadAll();return true});
    if(gok)toast('Gruppe angelegt');
  }else if(f==='setinvite'){
    const code=S.inviteNew.trim();
    if(code.length<6){toast('Das Zugangs-Passwort braucht mindestens 6 Zeichen.');return}
    S.inviteNew='';renderMain();
    const ok=await run(async()=>{await db(S.sb.rpc('set_invite_code',{p_code:code}));return true});
    if(ok)toast('Zugangs-Passwort gespeichert');
  }else if(f==='setcode'){
    const code=S.adminNew.trim();
    if(code.length<8){toast('Der Code braucht mindestens 8 Zeichen.');return}
    S.adminNew='';renderMain();
    const ok=await run(async()=>{await db(S.sb.rpc('set_admin_code',{p_code:code}));return true});
    if(ok)toast('Admin-Code gespeichert');
  }else if(f==='admincode'){
    S.adminMsg='';
    const code=S.adminCode;
    const ok=await run(()=>db(S.sb.rpc('redeem_admin_code',{p_code:code})));
    if(ok){S.adminCode='';await loadAll();toast('Du bist jetzt Admin')}
    else{S.adminMsg='Der Code stimmt nicht.';renderMain()}
  }
});

/* ---------- Anmeldung ---------- */
function authErrText(e){
  const m=(e&&e.message)||'';
  if(/^(Bitte|Das Passwort|Das Zugangs|Dieser)/.test(m))return m;
  if(/Database error saving new user/i.test(m))return 'Die Registrierung hat nicht geklappt. Stimmt das Zugangs-Passwort?';
  if(/Invalid login credentials/i.test(m))return 'E-Mail oder Passwort stimmt nicht.';
  if(/Email not confirmed/i.test(m))return 'Bitte bestätige zuerst deine E-Mail-Adresse.';
  if(/already registered/i.test(m))return 'Diese E-Mail-Adresse ist schon registriert.';
  if(/rate limit|too many/i.test(m))return 'Zu viele Versuche. Bitte kurz warten.';
  if(/valid email|invalid format/i.test(m))return 'Bitte eine gültige E-Mail-Adresse eingeben.';
  if(/Failed to fetch|network/i.test(m))return 'Keine Verbindung. Bitte später noch einmal versuchen.';
  return 'Die Anmeldung hat nicht geklappt. Bitte noch einmal versuchen.';
}
function renderAuth(){
  $wrap.hidden=true;$modal.innerHTML='';$auth.hidden=false;
  const brand=LOGO;
  if(!CONFIGURED){
    $auth.innerHTML=`<div class="authbox card">${brand}<h2>Noch nicht eingerichtet</h2><div class="muted">Trage oben in der Datei index.html die Supabase-URL und den anon key ein. Die Schritte stehen in der README.</div></div>`;
    return;
  }
  if(!S.sb){$auth.innerHTML=`<div class="authbox card">${brand}<div class="muted">Lade …</div></div>`;return}
  const a=S.auth,m=S.authMode,busy=S.authBusy?'disabled':'';
  const field=(id,label,type,key,ac,extra)=>`<div class="fld"><label for="${id}">${label}</label><input type="${type}" id="${id}" data-bind="auth:${key}" value="${esc(a[key])}" autocomplete="${ac}" ${extra||''}></div>`;
  const msg=(S.authErr?`<div class="banner bad">${esc(S.authErr)}</div>`:'')+(S.authInfo?`<div class="banner">${esc(S.authInfo)}</div>`:'');
  let body='';
  if(m==='login'){
    body=`<h2>Anmelden</h2><form class="form" data-form="login">${field('a-email','E-Mail','email','email','email')}${field('a-pw','Passwort','password','password','current-password')}${msg}<button class="btn primary" type="submit" ${busy}>Anmelden</button></form>
    <div class="authlinks"><button class="linkbtn" data-act="authmode" data-v="register">Konto erstellen</button><button class="linkbtn" data-act="authmode" data-v="forgot">Passwort vergessen</button></div>`;
  }else if(m==='register'){
    body=`<h2>Konto erstellen</h2><form class="form" data-form="register">${field('a-user','Benutzername','text','username','username','maxlength="30"')}${field('a-email','E-Mail','email','email','email')}${field('a-inv','Zugangs-Passwort (vom Admin)','password','invite','off')}${field('a-pw','Passwort (mindestens 8 Zeichen)','password','password','new-password')}${msg}<button class="btn primary" type="submit" ${busy}>Registrieren</button></form>
    <div class="authlinks"><button class="linkbtn" data-act="authmode" data-v="login">Ich habe schon ein Konto</button></div>`;
  }else if(m==='forgot'){
    body=`<h2>Passwort vergessen</h2><form class="form" data-form="forgot">${field('a-email','E-Mail','email','email','email')}${msg}<button class="btn primary" type="submit" ${busy}>Link senden</button></form>
    <div class="authlinks"><button class="linkbtn" data-act="authmode" data-v="login">Zurück zur Anmeldung</button></div>`;
  }else if(m==='newpass'){
    body=`<h2>Neues Passwort</h2><form class="form" data-form="newpass">${field('a-pw','Neues Passwort (mindestens 8 Zeichen)','password','password','new-password')}${msg}<button class="btn primary" type="submit" ${busy}>Passwort speichern</button></form>`;
  }else{
    body=`<h2>E-Mail bestätigen</h2><div>Wir haben dir eine E-Mail geschickt. Öffne den Link darin und melde dich danach an.</div><div class="authlinks"><button class="linkbtn" data-act="authmode" data-v="login">Zur Anmeldung</button></div>`;
  }
  $auth.innerHTML=`<div class="authbox card">${brand}${body}</div>`;
}
async function authSubmit(f){
  if(S.authBusy||!S.sb)return;
  const a=S.auth,email=a.email.trim();
  S.authErr='';S.authInfo='';S.authBusy=true;renderAuth();
  const back=location.origin+location.pathname;
  try{
    if(f==='login'){
      const {error}=await S.sb.auth.signInWithPassword({email,password:a.password});
      if(error)throw error;
      a.password='';
    }else if(f==='register'){
      const username=a.username.trim();
      if(username.length<2)throw new Error('Bitte einen Benutzernamen mit mindestens 2 Zeichen eingeben.');
      if(a.password.length<8)throw new Error('Das Passwort braucht mindestens 8 Zeichen.');
      const okc=await db(S.sb.rpc('check_invite_code',{p_code:a.invite}));
      if(!okc)throw new Error('Das Zugangs-Passwort stimmt nicht. Frag den Admin danach.');
      const free=await db(S.sb.rpc('username_available',{p_name:username}));
      if(!free)throw new Error('Dieser Benutzername ist schon vergeben.');
      const {data,error}=await S.sb.auth.signUp({email,password:a.password,options:{data:{username,invite_code:a.invite},emailRedirectTo:back}});
      if(error)throw error;
      a.password='';a.invite='';
      if(!data.session)S.authMode='check';
    }else if(f==='forgot'){
      const {error}=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:back});
      if(error)throw error;
      S.authInfo='Wenn die Adresse bekannt ist, kommt gleich eine E-Mail mit einem Link.';
    }else if(f==='newpass'){
      if(a.password.length<8)throw new Error('Das Passwort braucht mindestens 8 Zeichen.');
      const {error}=await S.sb.auth.updateUser({password:a.password});
      if(error)throw error;
      a.password='';S.authMode='login';toast('Passwort geändert');
    }
  }catch(e){S.authErr=authErrText(e)}
  S.authBusy=false;
  renderAll(true);
}

/* ---------- Daten laden ---------- */
let loadSeq=0,rt=null,rtTimer=null,pollTimer=null;
async function loadAll(){
  if(!S.sb||!S.session)return;
  const seq=++loadSeq;
  let res;
  try{res=await Promise.all(['inventory','events','event_days','event_gear','signups','absences','profiles','tasks','groups','group_members','event_groups'].map(t=>S.sb.from(t).select('*')).concat([S.sb.from('notes').select('*').order('created_at',{ascending:false}).limit(500)]))}
  catch(e){if(seq===loadSeq){S.dbError='Keine Verbindung. Die Anzeige kann veraltet sein.';renderAll(true)}return}
  if(seq!==loadSeq)return;
  const bad=res.slice(0,7).find(r=>r.error);
  S.tasksMissing=!!(res[7]&&res[7].error);
  S.groupsMissing=!!(res[8]&&res[8].error||res[9]&&res[9].error||res[10]&&res[10].error);
  S.notesMissing=!!(res[11]&&res[11].error);
  if(bad){S.dbError='Die Daten konnten nicht geladen werden ('+bad.error.message+').';renderAll(true);return}
  S.dbError='';
  const [inv,ev,days,gear,su,ab,pr,tk,gr,gm,eg,nt]=res.map(r=>r.data||[]);
  S.groups=gr.map(x=>({id:x.id,name:x.name,default:!!x.default_target}));
  S.members=gm.map(x=>({gid:x.group_id,uid:x.user_id}));
  S.notes=nt.map(x=>({id:x.id,body:x.body,author:x.author,created_at:x.created_at}));
  S.inv=inv.map(x=>({id:x.id,name:x.name||'Ohne Namen',qty:+x.qty||0,note:x.note||'',rental:!!x.rental,vendor:x.vendor||''}));
  S.events=buildEvents(ev,days,gear,eg);
  S.signups=su.map(x=>({id:x.event_id+'__'+x.user_id,eventId:x.event_id,uid:x.user_id,status:x.status,car:!!x.car,signedAt:x.signed_at||'',
    absences:ab.filter(y=>y.event_id===x.event_id&&y.user_id===x.user_id).map(y=>({id:y.id,date:y.date,from:hm(y.from_time),to:hm(y.to_time)}))}));
  S.profiles=pr;S.profMap={};pr.forEach(p=>{S.profMap[p.id]=p});
  S.tasks=tk.map(x=>({id:x.id,title:x.title,note:x.note||'',due:x.due_date||'',category:x.category||'sonstiges',contact:x.contact||'',assignee:x.assignee||null,eventId:x.event_id||null,eventTitle:x.event_title||'',repeat:!!x.repeat_yearly,done:!!x.done,doneAt:x.done_at||''}));
  const mine=S.profMap[S.session.user.id];
  S.me={id:S.session.user.id,name:mine?mine.username:'',isAdmin:!!(mine&&mine.is_admin)};
  if(!mine)S.dbError='Dein Profil fehlt. Ist das Datenbank-Schema (schema.sql) eingespielt?';
  S.loadedOnce=true;
  renderAll(false);
}
function subscribeRealtime(){
  if(rt)return;
  rt=S.sb.channel('hag-changes').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(loadAll,350)}).subscribe();
  pollTimer=setInterval(()=>{if(!document.hidden)loadAll()},60000);
}
function unsubscribeRealtime(){
  if(rt){S.sb.removeChannel(rt);rt=null}
  clearInterval(pollTimer);clearTimeout(rtTimer);
}
async function start(){
  S.me={id:S.session.user.id,name:'',isAdmin:false};
  await loadAll();
  subscribeRealtime();
  renderAll(true);
}
function onSession(session){
  const prev=S.session&&S.session.user.id,cur=session&&session.user.id;
  S.session=session;
  if(cur===prev){if(!session)renderAuth();return}
  if(!session){
    unsubscribeRealtime();
    S.me={id:null,name:'',isAdmin:false};S.loadedOnce=false;S.inv=[];S.events=[];S.signups=[];S.profiles=[];S.tasks=[];S.groups=[];S.members=[];S.notes=[];S.nDraft='';S.taskEd=null;S.tab='home';
    S.detail=null;S.editor=null;renderAuth();return;
  }
  start();
}
function init(){
  renderAuth();
  if(!CONFIGURED)return;
  if(!window.supabase||!window.supabase.createClient){S.dbError='Supabase konnte nicht geladen werden. Bitte die Seite neu laden.';$auth.innerHTML='<div class="authbox card"><div class="banner bad">'+esc(S.dbError)+'</div></div>';return}
  S.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb.auth.onAuthStateChange((event,session)=>{
    setTimeout(()=>{
      if(event==='PASSWORD_RECOVERY'){S.authMode='newpass';S.session=session;renderAuth();return}
      if(S.authMode==='newpass'&&event==='USER_UPDATED'){S.authMode='login';renderAll(true);return}
      onSession(session);
    },0);
  });
  S.sb.auth.getSession().then(r=>{if(!r.data.session)renderAuth()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.session)loadAll()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
})();
</script>
